name: OMEGA offline contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0, tag SHA verified
        with:
          node-version: '24.19.0'
          check-latest: false
      - name: Install pinned compiler development tools without lifecycle scripts
        run: npm ci --prefix integration/typescript --ignore-scripts --no-audit --no-fund --cache "$PWD/.omega/npm-cache"
      - name: Python compilation, strict TypeScript build, workflows, security rules and unified skill with 13 mode contracts
        run: python3 -m omega gates
      - name: TypeScript read-only bridge against real Python engine
        run: node --test integration/typescript/omega-bridge.test.mjs
      - name: Actual Node built-in test runner with JUnit red-to-green workflow
        run: python3 benchmarks/native_runners.py
      - name: Per-run report file independent from mixed runner logs
        run: python3 benchmarks/native_runners.py --report-file
      - name: Broken-to-fixed workflow fixture
        run: python3 benchmarks/demo.py
      - name: Lossless context efficiency benchmark
        run: python3 benchmarks/token_efficiency.py
      - name: Export tracked plugin bundle without installing tools or modifying user settings
        run: python3 benchmarks/plugin_packaging.py
      - name: Whitespace validation
        run: git diff --check
