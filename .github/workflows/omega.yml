name: OMEGA local contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build, tests, narrow policy audit, router and skill regression
        run: python3 -m omega gates
      - name: Broken-to-fixed workflow fixture
        run: python3 benchmarks/demo.py
      - name: Lossless context efficiency benchmark
        run: python3 benchmarks/token_efficiency.py
      - name: Whitespace validation
        run: git diff --check
