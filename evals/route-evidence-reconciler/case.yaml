schema_version: '1.0'
name: route-evidence-reconciler
tags:
- routing
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Bằng chứng test đã lưu của tôi bị báo là cũ (stale) sau khi tôi sửa code. Giải thích vì sao và phần nào bị lệch (HEAD, nội dung, môi trường).
  max_turns: 12
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Bash
  - Skill
graders:
- name: criteria
  type: llm
  weight: 1
  criteria: |
    Đạt khi câu trả lời xử lý đúng yêu cầu bằng nội dung có thật (không bịa kết quả) và nói rõ phần nào chưa kiểm tra.
- name: used-skill
  type: tool_used
  tool: Skill
  min: 1
  weight: 1
- name: ran-mode-command
  type: tool_used
  tool: Bash
  input_match: 'evidence-reconciler'
  min: 1
  weight: 1
