schema_version: '1.0'
name: route-skill-interference-benchmark
tags:
- routing
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Tôi có kết quả chạy 3 cấu hình: A (không skill), B (skill mới), A+B (cả hai) trên cùng một bộ task. Phân tích xem skill mới có gây hồi quy hoặc cản trở skill khác không.
  max_turns: 12
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Bash
  - Skill
graders:
- name: criteria
  type: llm
  weight: 1
  criteria: |
    Đạt khi câu trả lời xử lý đúng yêu cầu bằng nội dung có thật (không bịa kết quả) và nói rõ phần nào chưa kiểm tra.
- name: used-skill
  type: tool_used
  tool: Skill
  min: 1
  weight: 1
- name: ran-mode-command
  type: tool_used
  tool: Bash
  input_match: 'skill-interference-benchmark'
  min: 1
  weight: 1
