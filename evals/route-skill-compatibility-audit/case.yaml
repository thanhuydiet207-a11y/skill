schema_version: '1.0'
name: route-skill-compatibility-audit
tags:
- routing
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Project này sắp cài thêm vài skill Claude. Hãy kiểm tra xem các skill có xung đột nhau không (trùng tên, cùng muốn điều phối workflow hay quản lý Git).
  max_turns: 12
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Bash
  - Skill
graders:
- name: criteria
  type: llm
  weight: 1
  criteria: |
    Đạt khi câu trả lời xử lý đúng yêu cầu bằng nội dung có thật (không bịa kết quả) và nói rõ phần nào chưa kiểm tra.
- name: used-skill
  type: tool_used
  tool: Skill
  min: 1
  weight: 1
- name: ran-mode-command
  type: tool_used
  tool: Bash
  input_match: 'skill-compatibility-audit'
  min: 1
  weight: 1
