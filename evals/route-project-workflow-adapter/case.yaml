schema_version: '1.0'
name: route-project-workflow-adapter
tags:
- routing
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Đề xuất cách chạy build, test và security cho project Python này để dùng làm quality gates. Chỉ đề xuất, đừng cài hay ghi cấu hình.
  max_turns: 12
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Bash
  - Skill
graders:
- name: criteria
  type: llm
  weight: 1
  criteria: |
    Đạt khi câu trả lời xử lý đúng yêu cầu bằng nội dung có thật (không bịa kết quả) và nói rõ phần nào chưa kiểm tra.
- name: used-skill
  type: tool_used
  tool: Skill
  min: 1
  weight: 1
- name: ran-mode-command
  type: tool_used
  tool: Bash
  input_match: 'project-workflow-adapter'
  min: 1
  weight: 1
