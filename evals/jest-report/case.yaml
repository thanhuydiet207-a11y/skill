schema_version: '1.0'
name: jest-report
tags:
- phase1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Trong engine OMEGA, nếu Jest xuất báo cáo JSON với exit code 0 nhưng có một test suite lỗi runtime, gate tests có báo pass không? Chỉ rõ kiểm tra nào trong code xử lý việc này. Không sửa file nào.
  max_turns: 12
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: criteria
  type: llm
  weight: 2
  criteria: |
    Đạt khi câu trả lời: (1) kết luận gate KHÔNG pass; (2) chỉ ra `omega/adapters.py`, nhánh `jest` của hàm `outcomes`, kiểm tra `success` phải là true, `numFailedTestSuites` và `numRuntimeErrorTestSuites` phải bằng 0, và `wasInterrupted` phải là false; (3) không bịa file hay hàm.
    Không đạt nếu kết luận gate pass, hoặc không chỉ ra kiểm tra cụ thể.
