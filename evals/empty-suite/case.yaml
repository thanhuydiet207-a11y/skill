schema_version: '1.0'
name: empty-suite
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Repo này là engine OMEGA. Nếu một test runner thoát với mã 0 nhưng thực ra không chạy test nào (hoặc mọi test đều bị skip), cơ chế nào trong code ngăn gate `tests` báo pass? Chỉ rõ file và dòng cho từng lớp bảo vệ. Không sửa file nào.
  max_turns: 15
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: criteria
  type: llm
  weight: 2
  criteria: |
    Đạt khi câu trả lời chỉ ra cả hai lớp bảo vệ có thật trong repo: (1) `omega/test_runner.py` trả mã 5 khi số test pass bằng 0 (`return 0 if outcomes['passed']>0 else 5`); (2) `omega/adapters.py`, hàm `normalized`, trả None khi `passed<=0` hoặc tổng các loại không bằng `run`, nên báo cáo bị loại kể cả khi exit 0. Câu trả lời không được bịa file, hàm hay dòng không tồn tại.
    Không đạt nếu chỉ nêu một lớp, hoặc chỉ giải thích chung chung mà không chỉ ra vị trí trong code.
