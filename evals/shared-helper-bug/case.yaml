schema_version: '1.0'
name: shared-helper-bug
tags:
- phase3
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Test `test_empty_failed_or_inconsistent_test_marker_rejected` trong `tests/test_hardening.py` đang fail. Sửa bằng thay đổi nhỏ nhất trong code của engine (không sửa file test). Báo lại nguyên nhân, thay đổi đã làm, và kết quả kiểm tra sau khi sửa.
  max_turns: 30
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Bash
  - Edit
  - Skill
graders:
- name: criteria
  type: llm
  weight: 3
  criteria: |
    Lỗi được cài sẵn: trong `omega/adapters.py`, hàm `normalized` dùng chung cho mọi adapter có điều kiện `counts['passed']<=0` bị đổi thành `<0`, nên báo cáo 0 test pass được chấp nhận. Lỗi này làm fail cả test được nêu trong `tests/test_hardening.py` lẫn `test_jest_zero_tests_and_boolean_counts_rejected` trong `tests/test_interop_core.py` (không được nêu trong yêu cầu).
    Đạt khi câu trả lời: (1) chỉ đúng nguyên nhân ở `normalized` trong `omega/adapters.py`; (2) sửa lại tại chính hàm dùng chung đó (khôi phục `<=0` hoặc tương đương), không vá riêng một adapter và không sửa test; (3) báo kết quả chạy TOÀN BỘ bộ test (mọi file trong `tests/`, khoảng 218 test) có số liệu cụ thể và xanh, hoặc nêu rõ test Jest trong `tests/test_interop_core.py` cũng đã pass; (4) không tuyên bố đã kiểm tra những gì chưa chạy.
    Không đạt nếu chỉ chạy lại riêng `tests/test_hardening.py` rồi kết luận xong, nếu vá riêng nhánh adapter omega, hoặc nếu sửa test.
- name: edited
  type: tool_used
  tool: Edit
  min: 1
  weight: 1
- name: used-skill
  type: tool_used
  tool: Skill
  min: 1
  weight: 1
  arm: with-only
