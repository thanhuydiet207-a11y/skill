schema_version: '1.0'
name: release-files
tags:
- phase1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Tôi sửa code của plugin OMEGA và muốn người đã cài nhận được bản mới qua `claude plugin update`. Tôi phải sửa những file nào, và có gì trong repo kiểm tra việc này? Không sửa file nào.
  max_turns: 12
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: criteria
  type: llm
  weight: 2
  criteria: |
    Đạt khi câu trả lời: (1) nêu đủ ba chỗ version phải tăng cùng nhau: `.claude-plugin/plugin.json`, `.claude-plugin/marketplace.json` và `omega/__init__.py` (`__version__`); (2) giải thích `claude plugin update` dựa vào version nên không tăng thì bản cài không đổi; (3) chỉ ra test kiểm tra ba chỗ khớp nhau trong `tests/test_plugin_packaging.py`.
    Không đạt nếu thiếu một trong ba file hoặc không nhắc test kiểm tra.
