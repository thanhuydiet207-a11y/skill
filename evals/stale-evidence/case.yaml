schema_version: '1.0'
name: stale-evidence
tags:
- phase1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Repo này là engine OMEGA. Giả sử tôi đã chạy `gates` và có một file evidence pass trong `.omega/evidence/`, sau đó tôi sửa một file code. Evidence cũ đó còn được OMEGA chấp nhận không? Chỉ rõ cơ chế quyết định trong code (file và dòng). Không sửa file nào.
  max_turns: 15
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: criteria
  type: llm
  weight: 2
  criteria: |
    Đạt khi câu trả lời: (1) kết luận evidence cũ KHÔNG còn được chấp nhận; (2) chỉ ra phần so sánh độ "fresh" trong `omega/__main__.py` đối chiếu `workspace_sha256`, `head` (`git rev-parse HEAD`) và `execution_fingerprint` của evidence với trạng thái hiện tại; (3) nhắc `valid_gates` trong `omega/records.py` kiểm tra từng gate (exit code 0, `workspace_unchanged`, `execution_unchanged`, outcome test hợp lệ); (4) không bịa file hay hàm không tồn tại.
    Không đạt nếu chỉ nói chung chung mà không chỉ ra vị trí trong code, hoặc kết luận evidence cũ vẫn dùng được.
