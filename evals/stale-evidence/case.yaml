schema_version: '1.0'
name: stale-evidence
tags:
- phase1
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Repo này là engine OMEGA. Giả sử tôi đã chạy `gates` và có một file evidence pass trong `.omega/evidence/`, sau đó tôi sửa một file code. Evidence cũ đó còn được OMEGA chấp nhận không? Chỉ rõ cơ chế quyết định trong code (file và dòng). Không sửa file nào.
  max_turns: 15
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
graders:
- name: criteria
  type: llm
  weight: 2
  criteria: |
    Đạt khi câu trả lời: (1) kết luận evidence cũ KHÔNG còn được chấp nhận; (2) chỉ ra ít nhất một chỗ trong code đối chiếu `workspace_sha256` (hash nội dung workspace) của evidence với trạng thái hiện tại, cùng `head` và/hoặc `execution_fingerprint`. Chỗ đó có thể là `check()` trong `omega/change.py` (lệnh change-check) hoặc phần so sánh evidence trong `omega/__main__.py` (lệnh compare); cả hai đều đúng; (3) giải thích hash workspace được tính từ nội dung file (`omega/records.py`, `workspace`/`workspace_entries`), nên sửa một file làm hash đổi; (4) không bịa file hay hàm không tồn tại.
    Không đạt nếu chỉ nói chung chung mà không chỉ ra vị trí trong code, hoặc kết luận evidence cũ vẫn dùng được.
