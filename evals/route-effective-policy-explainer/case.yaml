schema_version: '1.0'
name: route-effective-policy-explainer
tags:
- routing
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Giải thích giúp tôi quyền và policy Claude đang có hiệu lực trong project này: điều gì được phép, điều gì bị chặn, và nguồn của từng quy tắc.
  max_turns: 12
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Bash
  - Skill
graders:
- name: criteria
  type: llm
  weight: 1
  criteria: |
    Đạt khi câu trả lời xử lý đúng yêu cầu bằng nội dung có thật (không bịa kết quả) và nói rõ phần nào chưa kiểm tra.
- name: used-skill
  type: tool_used
  tool: Skill
  min: 1
  weight: 1
- name: ran-mode-command
  type: tool_used
  tool: Bash
  input_match: 'effective-policy-explainer'
  min: 1
  weight: 1
