schema_version: '1.0'
name: route-workflow-handoff-contract
tags:
- routing
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    Tôi chia việc cho 2 agent: A sửa `ledger/amounts.py`, B cũng sửa `ledger/amounts.py`, rồi C viết test. Kiểm tra lịch giao việc này có hợp lệ không, có trùng owner hay writer chồng nhau không.
  max_turns: 12
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Bash
  - Skill
graders:
- name: criteria
  type: llm
  weight: 1
  criteria: |
    Đạt khi câu trả lời xử lý đúng yêu cầu bằng nội dung có thật (không bịa kết quả) và nói rõ phần nào chưa kiểm tra.
- name: used-skill
  type: tool_used
  tool: Skill
  min: 1
  weight: 1
- name: ran-mode-command
  type: tool_used
  tool: Bash
  input_match: 'workflow-handoff-contract'
  min: 1
  weight: 1
